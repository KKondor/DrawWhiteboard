name: Release Desktop App

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: DrawWhiteboard/frontend
        run: npm ci

      - name: Semantic Release
        working-directory: DrawWhiteboard/frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get release version
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

  build-tauri:
    needs: release

    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: DrawWhiteboard/frontend
        run: npm ci

      - name: Write production env file
        working-directory: DrawWhiteboard/frontend
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env.production
          echo "VITE_APP_VERSION=${{ needs.release.outputs.version }}" >> .env.production

      - name: Verify env file was populated
        working-directory: DrawWhiteboard/frontend
        run: |
          if grep -q "VITE_API_URL=$" .env.production; then
            echo "::error::VITE_API_URL is empty!"
            exit 1
          fi
          echo "VITE_API_URL is set (value hidden)"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          projectPath: DrawWhiteboard/frontend
          tagName: v${{ needs.release.outputs.version }}
          releaseName: v${{ needs.release.outputs.version }}
          releaseDraft: false
          prerelease: false
